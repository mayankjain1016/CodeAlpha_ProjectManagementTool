<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TaskFlow</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module">
    import { initTheme } from '/js/core/theme.js';
    initTheme();
  </script>
</head>
<body>
  <!-- Global Shell Container -->
  <div id="app-shell"></div>

  <!-- Dashboard Page Specific Markup Template (Injected into #page-content) -->
  <template id="dashboard-template">
    <div style="padding: 28px 32px; max-width: 1440px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 32px;">
      
      <!-- Greeting Header -->
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <h1 id="greeting-text" style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Welcome back</h1>
          </div>
          <div id="greeting-date" style="font-size: var(--font-size-xs); color: var(--text-subtle); margin-top: 3px; font-weight: 500;"></div>
          <p style="font-size: var(--font-size-sm); color: var(--text-muted); margin-top: 4px;">Here is an overview of your active projects and upcoming tasks.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="btn btn-primary" id="btn-create-project-dash">
            <!-- icon plus injected in JS -->
            <span>New project</span>
          </button>
        </div>
      </div>

      <!-- Stat Tiles Grid (4 Tiles) -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;" id="stat-tiles-container">
        <!-- Rendered dynamically with skeletons first -->
      </div>

      <!-- Main Dashboard Columns: Projects Grid (Left 2/3) & Right Panels (Right 1/3) -->
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 28px; align-items: start;" id="dash-split-container">
        
        <!-- Projects Section -->
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <h2 style="font-size: var(--font-size-md); font-weight: 600;">Projects</h2>
            <span class="count-badge" id="projects-total-count">0</span>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;" id="projects-grid">
            <!-- Project cards rendered here -->
          </div>
        </div>

        <!-- Right Stack: Upcoming Tasks & Team Workload -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
          <!-- Upcoming Tasks Section -->
          <div class="dash-panel">
            <div class="dash-panel-header">
              <h2 class="dash-panel-title">Upcoming tasks</h2>
              <a href="/my-tasks" class="dash-panel-link">View all</a>
            </div>

            <div id="upcoming-tasks-list" style="display: flex; flex-direction: column; gap: 8px;">
              <!-- Rendered dynamically -->
            </div>
          </div>

          <!-- Team Workload Mini Section -->
          <div class="dash-panel" id="team-workload-panel">
            <div class="dash-panel-header">
              <h2 class="dash-panel-title">Team workload</h2>
              <span class="count-badge" id="workload-members-count">0</span>
            </div>

            <div id="team-workload-list" style="display: flex; flex-direction: column; gap: 10px;">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>

      </div>
    </div>
  </template>

  <style>
    @media (max-width: 1024px) {
      #dash-split-container {
        grid-template-columns: 1fr !important;
      }
    }
    @media (max-width: 600px) {
      template + * {
        padding: 16px !important;
      }
    }
  </style>

  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
