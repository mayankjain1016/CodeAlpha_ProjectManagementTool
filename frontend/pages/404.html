<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - TaskFlow</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module">
    import { initTheme } from '/js/core/theme.js';
    initTheme();
  </script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-app); padding: 24px;">
  <div style="background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 48px 36px; max-width: 480px; width: 100%; text-align: center; box-shadow: var(--shadow-modal); display: flex; flex-direction: column; align-items: center; gap: 20px;">
    
    <div style="width: 64px; height: 64px; border-radius: var(--radius-xl); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center;">
      <svg class="icon icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <div>
      <h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px;">404 - Page Not Found</h1>
      <p style="font-size: var(--font-size-base); color: var(--text-muted); line-height: 1.5;">
        The page you are looking for doesn't exist, has been removed, or you don't have permission to view it.
      </p>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 8px;">
      <a href="/dashboard" class="btn btn-primary">
        Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="btn btn-secondary">
        Go Back
      </a>
    </div>
  </div>
</body>
</html>
